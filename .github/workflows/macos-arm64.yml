name: Build VeroRoute for macOS Apple Silicon

on:
  workflow_dispatch:
  schedule:
    - cron: '20 9 * * 1'
  push:
    branches: [master]
    paths:
      - '.github/workflows/macos-arm64.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out build tooling
        uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          xcodebuild -version

      - name: Install Qt 5
        run: |
          brew install qt@5
          echo "$(brew --prefix qt@5)/bin" >> "$GITHUB_PATH"

      - name: Find and download newest upstream source tarball
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html, re, urllib.request
          from pathlib import Path
          url = 'https://sourceforge.net/projects/veroroute/files/'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 VeroRoute-macOS-builder'})
          page = html.unescape(urllib.request.urlopen(req, timeout=45).read().decode('utf-8', 'replace'))
          versions = set(re.findall(r'veroroute-(\d+(?:\.\d+)+)\.tar\.gz', page, re.I))
          if not versions:
              raise SystemExit('No source tar.gz version found on SourceForge; refusing to build a stale version')
          version = max(versions, key=lambda s: tuple(map(int, s.split('.'))))
          Path('source-version.txt').write_text(version + '\n')
          print('Selected latest SourceForge source:', version)
          PY
          VERSION="$(cat source-version.txt)"
          curl --fail --location --retry 4 --retry-delay 5 \
            --output upstream.tar.gz \
            "https://sourceforge.net/projects/veroroute/files/veroroute-${VERSION}.tar.gz/download"
          tar -tzf upstream.tar.gz >/dev/null
          mkdir -p upstream
          tar -xzf upstream.tar.gz -C upstream
          echo "UPSTREAM_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Compile native arm64 app
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$(find upstream -type f -name veroroute.pro -print -quit)"
          test -n "$PROJECT"
          cd "$(dirname "$PROJECT")"
          qmake veroroute.pro CONFIG+=release QMAKE_APPLE_DEVICE_ARCHS=arm64
          make -j"$(sysctl -n hw.ncpu)"
          cd "$GITHUB_WORKSPACE"
          APP="$(find upstream -type d -name '*.app' -print -quit)"
          test -n "$APP"
          cp -R "$APP" VeroRoute.app
          BIN="$(find VeroRoute.app/Contents/MacOS -type f -maxdepth 1 -print -quit)"
          test -n "$BIN"
          file "$BIN"
          lipo -archs "$BIN" | grep -qw arm64

      - name: Bundle Qt frameworks and upstream resources
        shell: bash
        run: |
          set -euo pipefail
          QT_BIN="$(brew --prefix qt@5)/bin"
          "$QT_BIN/macdeployqt" VeroRoute.app -verbose=1
          mkdir -p VeroRoute.app/Contents/Resources
          for resource in tutorials Tutorials examples Examples libraries Libraries; do
            FOUND="$(find upstream -type d -name "$resource" -print -quit)"
            if [ -n "$FOUND" ]; then
              cp -R "$FOUND" VeroRoute.app/Contents/Resources/
            fi
          done
          # Keep tutorials adjacent to the executable as well: upstream uses
          # relative resource lookups in some versions.
          if [ -d VeroRoute.app/Contents/Resources/tutorials ]; then
            cp -R VeroRoute.app/Contents/Resources/tutorials VeroRoute.app/Contents/MacOS/
          elif [ -d VeroRoute.app/Contents/Resources/Tutorials ]; then
            cp -R VeroRoute.app/Contents/Resources/Tutorials VeroRoute.app/Contents/MacOS/
          fi
          BIN="$(find VeroRoute.app/Contents/MacOS -maxdepth 1 -type f -print -quit)"
          lipo -archs "$BIN" | grep -qw arm64
          echo "Built VeroRoute ${UPSTREAM_VERSION} for arm64"

      - name: Package application
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "VeroRoute-${UPSTREAM_VERSION}-macOS-arm64.app.tar.gz" VeroRoute.app
          shasum -a 256 "VeroRoute-${UPSTREAM_VERSION}-macOS-arm64.app.tar.gz" > SHA256SUMS.txt

      - name: Upload downloadable macOS app
        uses: actions/upload-artifact@v4
        with:
          name: VeroRoute-${{ env.UPSTREAM_VERSION }}-macOS-arm64
          path: |
            VeroRoute-*-macOS-arm64.app.tar.gz
            SHA256SUMS.txt
            source-version.txt
          retention-days: 90
