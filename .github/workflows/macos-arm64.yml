name: Build VeroRoute for macOS Apple Silicon

on:
  workflow_dispatch:
  schedule:
    - cron: '20 9 * * 1'
  push:
    branches: [master]
    paths:
      - '.github/workflows/macos-arm64.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out build tooling
        uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          xcodebuild -version

      - name: Install Qt 5
        run: |
          brew install qt@5
          echo "$(brew --prefix qt@5)/bin" >> "$GITHUB_PATH"

      - name: Find and download newest upstream source tarball
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.request
          from pathlib import Path
          # SourceForge blocks some GitHub runner IPs (HTTP 403).
          # RSS is attempted first; fall back to the last verified release
          # rather than fail before compilation. Update fallback as needed.
          urls = [
              'https://sourceforge.net/projects/veroroute/rss?path=/',
              'https://sourceforge.net/projects/veroroute/files/',
          ]
          versions = set()
          for url in urls:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  page = urllib.request.urlopen(req, timeout=20).read().decode('utf-8', 'replace')
                  versions.update(re.findall(r'veroroute-(\d+(?:\.\d+)+)\.tar\.gz', page, re.I))
              except Exception as exc:
                  print(f'Upstream index unavailable ({url}): {exc}')
          version = max(versions, key=lambda s: tuple(map(int, s.split('.')))) if versions else '2.40'
          Path('source-version.txt').write_text(version + '\n')
          print('Selected SourceForge version:', version)
          PY
          VERSION="$(cat source-version.txt)"
          downloaded=false
          for url in \
            "https://downloads.sourceforge.net/project/veroroute/veroroute-${VERSION}.tar.gz" \
            "https://netix.dl.sourceforge.net/project/veroroute/veroroute-${VERSION}.tar.gz" \
            "https://versaweb.dl.sourceforge.net/project/veroroute/veroroute-${VERSION}.tar.gz"; do
            if curl -fLsS --retry 2 --retry-delay 3 --connect-timeout 15 --max-time 120 -o upstream.tar.gz "$url" && tar -tzf upstream.tar.gz >/dev/null 2>&1; then
              downloaded=true
              break
            fi
          done
          if [ "$downloaded" != true ]; then
            echo "::error::Could not download a valid VeroRoute source archive from SourceForge mirrors"
            exit 1
          fi
          mkdir -p upstream
          tar -xzf upstream.tar.gz -C upstream
          echo "UPSTREAM_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Compile native arm64 app
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$(find upstream -type f -name veroroute.pro -print -quit)"
          test -n "$PROJECT"
          cd "$(dirname "$PROJECT")"
          qmake veroroute.pro CONFIG+=release QMAKE_APPLE_DEVICE_ARCHS=arm64
          make -j"$(sysctl -n hw.ncpu)"
          cd "$GITHUB_WORKSPACE"
          APP="$(find upstream -type d -name '*.app' -print -quit)"
          test -n "$APP"
          cp -R "$APP" VeroRoute.app
          BIN="$(find VeroRoute.app/Contents/MacOS -type f -maxdepth 1 -print -quit)"
          test -n "$BIN"
          file "$BIN"
          lipo -archs "$BIN" | grep -qw arm64

      - name: Bundle Qt frameworks and upstream resources
        shell: bash
        run: |
          set -euo pipefail
          QT_BIN="$(brew --prefix qt@5)/bin"
          "$QT_BIN/macdeployqt" VeroRoute.app -verbose=1
          mkdir -p VeroRoute.app/Contents/Resources
          for resource in tutorials Tutorials examples Examples libraries Libraries; do
            FOUND="$(find upstream -type d -name "$resource" -print -quit)"
            if [ -n "$FOUND" ]; then
              cp -R "$FOUND" VeroRoute.app/Contents/Resources/
            fi
          done
          # Keep tutorials adjacent to the executable as well: upstream uses
          # relative resource lookups in some versions.
          if [ -d VeroRoute.app/Contents/Resources/tutorials ]; then
            cp -R VeroRoute.app/Contents/Resources/tutorials VeroRoute.app/Contents/MacOS/
          elif [ -d VeroRoute.app/Contents/Resources/Tutorials ]; then
            cp -R VeroRoute.app/Contents/Resources/Tutorials VeroRoute.app/Contents/MacOS/
          fi
          BIN="$(find VeroRoute.app/Contents/MacOS -maxdepth 1 -type f -print -quit)"
          lipo -archs "$BIN" | grep -qw arm64
          echo "Built VeroRoute ${UPSTREAM_VERSION} for arm64"

      - name: Ad-hoc sign deployed application and verify signatures
        shell: bash
        run: |
          set -euo pipefail
          # macdeployqt rewrites Mach-O load commands and copies frameworks.
          # Existing signatures can become invalid (CODESIGNING Invalid Page).
          # Sign the finished bundle only after all modifications are complete.
          codesign --force --deep --sign - --timestamp=none VeroRoute.app
          codesign --verify --deep --strict --verbose=2 VeroRoute.app
          codesign -dv --verbose=2 VeroRoute.app 2>&1
          BIN="$(find VeroRoute.app/Contents/MacOS -maxdepth 1 -type f -print -quit)"
          test -n "$BIN"
          lipo -archs "$BIN" | grep -qw arm64

      - name: Package application
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "VeroRoute-${UPSTREAM_VERSION}-macOS-arm64.app.tar.gz" VeroRoute.app
          shasum -a 256 "VeroRoute-${UPSTREAM_VERSION}-macOS-arm64.app.tar.gz" > SHA256SUMS.txt

      - name: Upload downloadable macOS app
        uses: actions/upload-artifact@v4
        with:
          name: VeroRoute-${{ env.UPSTREAM_VERSION }}-macOS-arm64
          path: |
            VeroRoute-*-macOS-arm64.app.tar.gz
            SHA256SUMS.txt
            source-version.txt
          retention-days: 90

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${UPSTREAM_VERSION}-macos-arm64"
          ARCHIVE="VeroRoute-${UPSTREAM_VERSION}-macOS-arm64.app.tar.gz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$ARCHIVE" SHA256SUMS.txt \
              --title "VeroRoute ${UPSTREAM_VERSION} for macOS Apple Silicon" \
              --notes "Unofficial native macOS ARM64 build from the VeroRoute SourceForge source archive. Download the .app.tar.gz, extract, and open VeroRoute.app. This app is not notarized."
          fi
